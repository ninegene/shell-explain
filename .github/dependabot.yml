# Dependabot opens weekly PRs for npm packages and GitHub Actions. Go modules are
# vendored under third-party/ on purpose and are not covered here.
# Node.js and the Pulumi CLI (mise.toml) are not covered either: update them by hand.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /web
      - /infra/pulumi
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: chore(deps)
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      pulumi:
        patterns: ["@pulumi/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is held back until @astrojs/check supports it (checked 2026-11-16,
      # same rule as ninegene/ninegene.com). Remove this entry when it does.
      - dependency-name: typescript
        versions: [">=7"]
      # @types/node follows the Node.js major, which is bumped by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
