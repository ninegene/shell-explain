name: Verify existing Linux AMD64 candidate

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: ID of the privately staged candidate release asset
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Confirm GitHub runner platform
        shell: bash
        run: |
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download staged candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || { printf 'Asset ID must be numeric\n' >&2; exit 1; }
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GH_REPO/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/candidate.tar.gz"
      - name: Verify and test exact candidate
        shell: bash
        run: bash scripts/verify-linux-amd64-candidate.sh "$RUNNER_TEMP/candidate.tar.gz" "$RUNNER_TEMP/candidate-results"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-candidate-verification
          path: |
            ${{ runner.temp }}/candidate-results/*.txt
            ${{ runner.temp }}/candidate-results/*.sha256
            ${{ runner.temp }}/candidate-results/*.stdout
            ${{ runner.temp }}/candidate-results/*.stderr
            ${{ runner.temp }}/candidate-results/*.exit
          if-no-files-found: warn
          retention-days: 14
