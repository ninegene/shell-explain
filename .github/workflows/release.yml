name: Release

# Pushing a version tag such as v0.1.0 builds the archives, smoke-tests them on
# native runners, attests their provenance and creates a DRAFT release. Review the
# draft and publish it by hand; nothing is published automatically.
# Running the workflow by hand (workflow_dispatch) is a dry run: it builds and
# smoke-tests version v0.0.0-dispatch and creates no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tagged commit is not on main"; exit 1; }
      # Keep this version in step with the Go runtime notices (docs/third-party-notices.md):
      # the build script refuses a toolchain the notices do not mention.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.3"
      - name: Go tests and static analysis
        run: |
          go vet ./...
          go test ./...
      - name: Test the release scripts
        run: |
          bash scripts/test_release.sh
          bash scripts/test_install.sh
      - name: Build the archives
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dispatch' }}
        run: |
          bash scripts/build-release.sh "$TAG" dist
          cp scripts/install.sh dist/install.sh
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, suffix: linux_amd64 }
          - { runner: ubuntu-26.04-arm, suffix: linux_arm64 }
          - { runner: macos-26, suffix: darwin_arm64 }
          - { runner: macos-26-intel, suffix: darwin_amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify, unpack and smoke-test the archive built for this machine
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          cd dist
          archive="$(ls explain_*_"$SUFFIX".tar.gz)"
          grep "  $archive\$" checksums.txt | shasum -a 256 -c -
          mkdir ../unpacked && tar -xzf "$archive" -C ../unpacked
          cd ..
          explain=./unpacked/explain
          # grep reads all input (no -q), so pipefail never sees a broken pipe.
          "$explain" --version
          "$explain" --version | grep '^explain [0-9]' >/dev/null
          "$explain" --no-probe grep | grep "grep" >/dev/null
          "$explain" ssh | grep "ssh user@host" >/dev/null
          "$explain" list | grep "^grep " >/dev/null
          "$explain" search logs | grep "grep " >/dev/null
          "$explain" learn big-picture --no-pager | grep "From Keypress to Screen" >/dev/null
          test -f unpacked/LICENSE && test -f unpacked/third-party/go-runtime/LICENSE

  release:
    if: ${{ github.ref_type == 'tag' }}
    needs: [build, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* "${flags[@]}"
