name: Native Linux AMD64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-amd64-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Confirm GitHub runner platform
        shell: bash
        run: |
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and test browser
        shell: bash
        run: |
          npm ci --prefix web
          cd web && npx playwright install --with-deps chromium
      # The commands below mirror the justfile recipes, so the runner needs no just.
      - name: Build explain CLI
        shell: bash
        run: |
          go build -trimpath -o "$RUNNER_TEMP/explain" ./cmd/explain
          go version -m "$RUNNER_TEMP/explain"
      - name: Smoke-test the built CLI
        shell: bash
        run: bash scripts/cli-smoke.sh "$RUNNER_TEMP/explain" "$RUNNER_TEMP/cli-smoke"
      - name: Go tests
        if: ${{ !cancelled() }}
        run: go test ./...
      - name: Go static analysis
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: Website formatting and Astro checks
        if: ${{ !cancelled() }}
        run: |
          npm --prefix web run format:check
          npm --prefix web run check
      # The Playwright suite only. `npm --prefix web test` also runs the dev-server
      # watcher test (web/scripts/content-watch.test.mjs), which is skipped for now
      # because it failed on this runner (run 44032763061). The pretest step builds
      # the bin/explain binary that the browser tests compare the site against.
      - name: Browser tests (Playwright)
        if: ${{ !cancelled() }}
        run: |
          npm --prefix web run pretest
          node web/scripts/test-e2e.mjs
      - name: Upload smoke-test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-amd64-cli-smoke
          path: ${{ runner.temp }}/cli-smoke/
          if-no-files-found: warn
          retention-days: 14
